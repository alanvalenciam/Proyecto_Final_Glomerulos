tile_size: 1024
zoom_scale: 0.5
stride: 1024
min_coverage_pct: 60.0
output_format: png
compression: 0

# Manifest build options
force_rebuild_manifest: true
  # Set to true to rebuild the manifest from annotations.json (ignores cache)
classifier_input_size: 224
  # Target size for resized glomerulus crops (224 is optimal for EfficientNet-B0 and ResNet-50)
manifest_primary_only: false
  # Set to false to include glomeruli without a primary centered tile
min_component_px: 100
  # Minimum connected-component area in pixels; components smaller than this are filtered out
crop_padding_px: 128
  # Native pixels added symmetrically on all 4 sides of each glomerulus tight bbox before extraction; range [0, 256]

tissue_filter:
  otsu_min_ratio: 0.01
  bg_threshold: 15.0
  downsample_factor: 20

class_map:
  background: 0
  No_Proliferativo: 1
  Proliferativo: 2
  Esclerosado: 3
  Excluido: 4

class_gray_values:
  background: 0
  No_Proliferativo: 64
  Proliferativo: 128
  Esclerosado: 192
  Excluido: 255